<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Weather Sandbox - Supercell Simulator</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        #mainCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #uiOverlay {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            font-family: monospace;
            font-size: 14px;
            pointer-events: none;
            z-index: 10;
        }
    </style>
    <!-- Bibliothèques nécessaires -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
</head>
<body>
    <div id="uiOverlay">
        <div>3D Weather Sandbox - Mode WebGL2</div>
        <div id="fpsDisplay">FPS: --</div>
    </div>
    <canvas id="mainCanvas"></canvas>

    <!-- Inclusion du script principal -->
    <script src="app.js"></script>
</body>
</html>
